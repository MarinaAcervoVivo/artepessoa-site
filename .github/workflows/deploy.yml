name: Deploy to Hostinger via FTP

on:
  push:
    branches: [main]

env:
  # Opt into Node.js 24 to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 147.93.64.87
          username: u636715437.artepessoa.com.br
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./
          # PASSIVE mode — required for Hostinger (NAT/firewall compatibility)
          passive: true
          # Generous timeout for large static export uploads
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            desktop.ini
            **/.DS_Store
